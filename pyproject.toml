[project]
name = "cutnote"
version = "0.1.0"
description = "Newspaper cutout notes as portable SVGs, from a CLI or local browser editor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typer>=0.16,<1", "fonttools>=4.58,<5"]

[project.scripts]
cutnote = "cutnote.cli:app"

[build-system]
requires = ["uv_build>=0.9.13,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "tests/**", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
